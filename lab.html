<!doctype html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>손글씨 채점 재기</title>
<style>
:root{color-scheme:dark}
body{margin:0;background:#0f1115;color:#e8e6e1;font:400 16px/1.5 -apple-system,"Apple SD Gothic Neo",sans-serif;padding:1rem;max-width:34rem;margin:0 auto}
h1{font-size:1.1rem;margin:.2rem 0 1rem;color:#9aa4a0}
.tip{color:#f0b45e;font-size:.9rem;margin:0 0 .3rem}
.word{font-size:2.6rem;font-weight:700;letter-spacing:.02em;margin:.1rem 0 .2rem}
.orig{color:#7d8783;font-size:.85rem;margin:0 0 .8rem}
canvas{width:100%;height:230px;background:#fff;border-radius:8px;touch-action:none;display:block}
.row{display:flex;gap:.5rem;margin:.7rem 0}
button{flex:1;font:inherit;font-size:.95rem;padding:.75rem;border:0;border-radius:8px;background:#232a2c;color:#e8e6e1;cursor:pointer}
button.go{background:#1f6f5c;color:#fff;font-weight:600}
button:disabled{opacity:.45}
.bar{height:6px;background:#232a2c;border-radius:3px;overflow:hidden;margin:.2rem 0 1rem}
.bar i{display:block;height:100%;background:#1f6f5c}
.msg{min-height:2.6rem;font-size:.9rem;color:#9aa4a0;margin:.4rem 0}
.msg b.ok{color:#54b79c}.msg b.no{color:#e0704e}
.done{background:#161b1d;border-radius:8px;padding:1rem;margin-top:1rem}
.done h2{font-size:1rem;margin:0 0 .6rem}
textarea{width:100%;height:9rem;background:#0f1115;color:#e8e6e1;border:1px solid #2a3033;border-radius:6px;padding:.6rem;font:400 12px/1.5 ui-monospace,monospace}
</style></head><body>
<h1>손글씨 채점이 얼마나 맞는지 재는 중</h1>
<div class="bar"><i id="fill" style="width:0"></i></div>
<p class="tip" id="tip"></p>
<p class="word" id="word"></p>
<p class="orig" id="orig"></p>
<canvas id="cv"></canvas>
<div class="row"><button id="clr">지우기</button><button id="go" class="go">채점받기</button></div>
<div class="row"><button id="skip">건너뛰기</button></div>
<p class="msg" id="msg"></p>
<div id="done" hidden class="done"></div>
<script>
const ITEMS = [{"w": "trăm", "show": "trăm", "truth": "ok", "tip": "그대로 쓰세요"}, {"w": "chạy thử", "show": "thạy thử", "truth": "no", "tip": "글자를 바꿔서"}, {"w": "thùng", "show": "chùng", "truth": "no", "tip": "글자를 바꿔서"}, {"w": "xin lỗi", "show": "xin lỗi", "truth": "ok", "tip": "그대로 쓰세요"}, {"w": "khỏi", "show": "khỏi", "truth": "ok", "tip": "그대로 쓰세요"}, {"w": "cắt", "show": "căt", "truth": "no", "tip": "성조 부호를 빼고"}, {"w": "cảm", "show": "cảm", "truth": "ok", "tip": "그대로 쓰세요"}, {"w": "bật", "show": "bạt", "truth": "no", "tip": "모자를 빼고"}, {"w": "nộp", "show": "nộp", "truth": "ok", "tip": "그대로 쓰세요"}, {"w": "khóa", "show": "khóa", "truth": "ok", "tip": "그대로 쓰세요"}, {"w": "thứ tư", "show": "thư tư", "truth": "no", "tip": "성조 부호를 빼고"}, {"w": "tỷ số", "show": "tỷ số", "truth": "ok", "tip": "그대로 쓰세요"}, {"w": "bỏ mũi", "show": "bỏ mũi", "truth": "ok", "tip": "그대로 쓰세요"}, {"w": "lệch", "show": "lệch", "truth": "ok", "tip": "그대로 쓰세요"}, {"w": "đèn", "show": "đèn", "truth": "ok", "tip": "그대로 쓰세요"}, {"w": "ý kiến", "show": "ý kiến", "truth": "ok", "tip": "그대로 쓰세요"}, {"w": "cãi nhau", "show": "cãi nhau", "truth": "ok", "tip": "그대로 쓰세요"}, {"w": "bật", "show": "bât", "truth": "no", "tip": "성조 부호를 빼고"}, {"w": "hôm kia", "show": "hôm kia", "truth": "ok", "tip": "그대로 쓰세요"}, {"w": "trà đá", "show": "trà đá", "truth": "ok", "tip": "그대로 쓰세요"}, {"w": "thế nào", "show": "chế nào", "truth": "no", "tip": "글자를 바꿔서"}, {"w": "đừng", "show": "đừng", "truth": "ok", "tip": "그대로 쓰세요"}, {"w": "thùng", "show": "thung", "truth": "no", "tip": "성조 부호를 빼고"}, {"w": "miền Nam", "show": "miền Nam", "truth": "ok", "tip": "그대로 쓰세요"}, {"w": "tay", "show": "pay", "truth": "no", "tip": "글자를 바꿔서"}, {"w": "máy cắt", "show": "máy cắt", "truth": "ok", "tip": "그대로 쓰세요"}, {"w": "tôi", "show": "toi", "truth": "no", "tip": "모자를 빼고"}, {"w": "nhớ nhà", "show": "nhớ nhà", "truth": "ok", "tip": "그대로 쓰세요"}, {"w": "mật khẩu", "show": "mạt khảu", "truth": "no", "tip": "모자를 빼고"}, {"w": "giày", "show": "giày", "truth": "ok", "tip": "그대로 쓰세요"}, {"w": "thế nào", "show": "thê nao", "truth": "no", "tip": "성조 부호를 빼고"}, {"w": "tuyển", "show": "tuyển", "truth": "ok", "tip": "그대로 쓰세요"}, {"w": "bảo hiểm", "show": "bảo hiểm", "truth": "ok", "tip": "그대로 쓰세요"}, {"w": "với", "show": "với", "truth": "ok", "tip": "그대로 쓰세요"}, {"w": "xin chào", "show": "xin chào", "truth": "ok", "tip": "그대로 쓰세요"}, {"w": "đợi", "show": "đợi", "truth": "ok", "tip": "그대로 쓰세요"}, {"w": "chán", "show": "chán", "truth": "ok", "tip": "그대로 쓰세요"}, {"w": "quyết định", "show": "quyết định", "truth": "ok", "tip": "그대로 쓰세요"}, {"w": "mật khẩu", "show": "nật khẩu", "truth": "no", "tip": "글자를 바꿔서"}, {"w": "tính tiền", "show": "tính tiền", "truth": "ok", "tip": "그대로 쓰세요"}, {"w": "cái", "show": "cái", "truth": "ok", "tip": "그대로 쓰세요"}, {"w": "đổi", "show": "đổi", "truth": "ok", "tip": "그대로 쓰세요"}, {"w": "tay áo", "show": "tay áo", "truth": "ok", "tip": "그대로 쓰세요"}, {"w": "chưa", "show": "chưa", "truth": "ok", "tip": "그대로 쓰세요"}, {"w": "sửa sai", "show": "sửa sai", "truth": "ok", "tip": "그대로 쓰세요"}, {"w": "chạy thử", "show": "chạy thủ", "truth": "no", "tip": "모자를 빼고"}, {"w": "thực đơn", "show": "thực đơn", "truth": "ok", "tip": "그대로 쓰세요"}, {"w": "chạy thử", "show": "chay thư", "truth": "no", "tip": "성조 부호를 빼고"}, {"w": "in", "show": "in", "truth": "ok", "tip": "그대로 쓰세요"}, {"w": "ngoài", "show": "ngoài", "truth": "ok", "tip": "그대로 쓰세요"}, {"w": "cắt", "show": "cát", "truth": "no", "tip": "모자를 빼고"}, {"w": "mật khẩu", "show": "mât khâu", "truth": "no", "tip": "성조 부호를 빼고"}, {"w": "xuống", "show": "xuống", "truth": "ok", "tip": "그대로 쓰세요"}, {"w": "thế nào", "show": "thé nào", "truth": "no", "tip": "모자를 빼고"}, {"w": "động viên", "show": "động viên", "truth": "ok", "tip": "그대로 쓰세요"}, {"w": "bia", "show": "bia", "truth": "ok", "tip": "그대로 쓰세요"}, {"w": "làm việc", "show": "làm việc", "truth": "ok", "tip": "그대로 쓰세요"}, {"w": "bật", "show": "dật", "truth": "no", "tip": "글자를 바꿔서"}, {"w": "thứ tư", "show": "thú tu", "truth": "no", "tip": "모자를 빼고"}, {"w": "túi", "show": "túi", "truth": "ok", "tip": "그대로 쓰세요"}];
const KEY='handlab';
let log = JSON.parse(localStorage.getItem(KEY)||'[]');
let i = log.length;
const $=s=>document.querySelector(s);
const cv=$('#cv'), g=cv.getContext('2d');
function fit(){ const r=cv.getBoundingClientRect(), d=devicePixelRatio||1;
  cv.width=r.width*d; cv.height=r.height*d; g.scale(d,d);
  g.fillStyle='#fff'; g.fillRect(0,0,r.width,r.height);
  g.strokeStyle='#111'; g.lineWidth=4; g.lineCap='round'; g.lineJoin='round'; }
addEventListener('resize',()=>{fit();});
let drawing=false;
cv.addEventListener('pointerdown',e=>{drawing=true;cv.setPointerCapture(e.pointerId);
  const r=cv.getBoundingClientRect();g.beginPath();g.moveTo(e.clientX-r.left,e.clientY-r.top);});
cv.addEventListener('pointermove',e=>{if(!drawing)return;const r=cv.getBoundingClientRect();
  g.lineTo(e.clientX-r.left,e.clientY-r.top);g.stroke();});
addEventListener('pointerup',()=>drawing=false);
$('#clr').onclick=()=>fit();

function targetCard(text){
  const c=document.createElement('canvas'); c.width=720; c.height=240;
  const x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,720,240); x.fillStyle='#000';
  let px=150; do{ x.font=`700 ${px}px "Times New Roman", Georgia, serif`; px-=6; }
  while(x.measureText(text).width>660 && px>30);
  x.textAlign='center'; x.textBaseline='middle'; x.fillText(text,360,120);
  return c.toDataURL('image/jpeg',.9).split(',')[1];
}
function inkCrop(c){
  const x=c.getContext('2d'), d=x.getImageData(0,0,c.width,c.height).data;
  let x0=c.width,y0=c.height,x1=0,y1=0;
  for(let y=0;y<c.height;y+=2)for(let p=0;p<c.width;p+=2){const k=(y*c.width+p)*4;
    if(d[k]<200||d[k+1]<200||d[k+2]<200){if(p<x0)x0=p;if(p>x1)x1=p;if(y<y0)y0=y;if(y>y1)y1=y;}}
  if(x1<=x0||y1<=y0) return null;
  const pad=16; x0=Math.max(0,x0-pad);y0=Math.max(0,y0-pad);
  x1=Math.min(c.width,x1+pad);y1=Math.min(c.height,y1+pad);
  const w=x1-x0,h=y1-y0,k=Math.min(1,512/w);
  const o=document.createElement('canvas'); o.width=Math.round(w*k); o.height=Math.round(h*k);
  const ox=o.getContext('2d'); ox.fillStyle='#fff'; ox.fillRect(0,0,o.width,o.height);
  ox.drawImage(c,x0,y0,w,h,0,0,o.width,o.height);
  return o.toDataURL('image/jpeg',.8).split(',')[1];
}
const P = t => '사진 두 장이다. **첫째**는 인쇄된 정답 "'+t+'", '+
 '**둘째**는 한국인 학습자가 손으로 쓴 것이다.\n'+
 '읽어내려 하지 말고 **두 장을 견주어라.** 둘째가 첫째와 같은 낱말인가?\n\n'+
 '볼 곳은 셋이다:\n'+
 ' · 글자 — 알파벳이 빠짐없이 같은 차례로 있는가\n'+
 ' · 성조 — 성조 부호(◌\u0301 ◌\u0300 ◌\u0309 ◌\u0303 ◌\u0323)가 맞는 글자 위(아래)에 맞는 모양으로 있는가\n'+
 ' · 모자 — ă â ê ô ơ ư đ 의 모자·갈고리·가로줄이 제대로 붙었는가\n\n'+
 '**흐리거나 흘려 써서 확실하지 않으면 "모르겠음"이라고 답하라.** '+
 '틀리지 않은 글씨를 틀렸다고 하면 안 된다.\n\n'+
 '아래 형식 그대로, 한국어로:\n읽힘: (둘째 사진이 읽히는 그대로)\n'+
 '글자: 맞음 | 틀림 | 모르겠음\n성조: 맞음 | 틀림 | 없음 | 모르겠음\n'+
 '모자: 맞음 | 틀림 | 해당없음 | 모르겠음\n판정: 맞음 | 틀림 | 모르겠음\n조언: (한 줄)';

async function gCall(body){
  for(let k=0;k<4;k++){
    const r=await fetch('https://viet-ai.chaochao-app.workers.dev',
      {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    const j=await r.json().catch(()=>({}));
    const t=j?.candidates?.[0]?.content?.parts?.[0]?.text;
    if(t) return t;
    await new Promise(s=>setTimeout(s,4000+k*4000));
  }
  throw new Error('AI가 계속 붐빕니다');
}
function draw(){
  if(i>=ITEMS.length) return finish();
  const it=ITEMS[i];
  $('#tip').textContent=(i+1)+' / '+ITEMS.length+' — '+it.tip;
  $('#word').textContent=it.show;
  $('#orig').textContent = it.truth==='ok' ? '' : '(원래 낱말은 '+it.w+' 입니다 — 화면에 크게 보이는 대로 쓰세요)';
  $('#fill').style.width=(100*i/ITEMS.length)+'%';
  $('#msg').textContent=''; fit(); $('#go').disabled=false;
}
$('#skip').onclick=()=>{ i++; draw(); };
$('#go').onclick=async()=>{
  const it=ITEMS[i], mine=inkCrop(cv);
  if(!mine){ $('#msg').textContent='아무것도 안 쓰셨습니다.'; return; }
  $('#go').disabled=true; $('#msg').textContent='AI가 보는 중…';
  try{
    const t=await gCall({contents:[{role:'user',parts:[{text:P(it.w)},
      {inline_data:{mime_type:'image/jpeg',data:targetCard(it.w)}},
      {inline_data:{mime_type:'image/jpeg',data:mine}}]}],
      generationConfig:{maxOutputTokens:300,thinkingConfig:{thinkingBudget:0}}});
    const m=/판정\s*[:：]\s*(.+)/.exec(t)||[]; const v=(m[1]||'').trim();
    const said = /맞음/.test(v)?'ok' : /틀림/.test(v)?'no' : 'unsure';
    const right = said===it.truth;
    log.push({w:it.w,show:it.show,truth:it.truth,said,
              읽힘:(/읽힘\s*[:：]\s*(.+)/.exec(t)||[])[1]||''});
    localStorage.setItem(KEY,JSON.stringify(log));
    $('#msg').innerHTML = 'AI 판정 <b class="'+(right?'ok':'no')+'">'+
      (said==='ok'?'맞게 썼음':said==='no'?'틀리게 썼음':'모르겠음')+'</b> — '+
      (right?'제대로 봤습니다':'<b class="no">틀린 판정입니다</b>');
    setTimeout(()=>{i++;draw();}, 1100);
  }catch(e){ $('#msg').textContent=e.message; $('#go').disabled=false; }
};
function finish(){
  const ok=log.filter(x=>x.truth==='ok'), no=log.filter(x=>x.truth==='no');
  const c=(a,s)=>a.filter(x=>x.said===s).length;
  const p=(a,b)=>b?(100*a/b).toFixed(1)+'%':'-';
  $('#done').hidden=false;
  $('#done').innerHTML='<h2>다 하셨습니다</h2>'+
   '<p>맞게 쓴 것 '+ok.length+'장 → O '+c(ok,'ok')+' ('+p(c(ok,'ok'),ok.length)+') · X '+c(ok,'no')+' · 모르겠음 '+c(ok,'unsure')+'</p>'+
   '<p>틀리게 쓴 것 '+no.length+'장 → X '+c(no,'no')+' ('+p(c(no,'no'),no.length)+') · O '+c(no,'ok')+' · 모르겠음 '+c(no,'unsure')+'</p>'+
   '<p>아래 글을 통째로 복사해서 클로드에게 보내 주세요.</p>'+
   '<textarea readonly>'+JSON.stringify(log)+'</textarea>';
  $('#done').scrollIntoView();
  document.querySelectorAll('.row,#tip,#word,#orig,canvas,.msg').forEach(e=>e.hidden=true);
}
fit(); draw();
</script></body></html>
