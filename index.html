<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="짜오짜오">
<meta name="mobile-web-app-capable" content="yes">
<title>짜오짜오 — 한국어</title>
<link rel="stylesheet" href="style.css?v=aa760527">
</head>
<body>

<header id="top">
  <button id="back" class="ghost" hidden>‹</button>
  <!-- 홈 단추는 하단 탭바의 '홈' 탭과 겹쳐 뺐다(2026-09-08) — 탭바가 늘 떠 있어 어디서든 한 번에 홈으로 간다. -->
  <h1 id="title">짜오짜오</h1>
  <button id="goMe" class="ghost icon" title="내 정보" aria-label="내 정보">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.6"/><path d="M4.8 20a7.2 7.2 0 0 1 14.4 0"/></svg>
  </button>
  <button id="region" class="ghost" title="북부/남부 소리 전환">북부</button>
  <button id="voice" class="ghost" title="목소리 바꾸기">여</button>
</header>

<main>
  <!-- 홈 -->
  <section id="home" class="view">
    <div id="plan" class="plan"></div>
    <div id="progress" class="progress"></div>
    <div class="menu" id="menu"></div>
  </section>

  <!-- 학습 -->
  <section id="learn" class="view" hidden>
    <!-- 학습 방법 탭 — 카드 학습/강의/애니메이션/노래 (2026-09-08 대표님 지시, chaochao에서 이식).
         하루5분(자동 진행)에서는 숨기고, 목차에서 레슨을 직접 골랐을 때만 보인다. -->
    <div id="lessonTabs" class="lessontabs" hidden></div>
    <div id="card" class="card"></div>
    <div id="lessonExtra" class="lessonextra" hidden></div>
    <!-- '‹ 이전 / 다음 ›' 을 뺐다 (대표님 지시) — **밀어서 넘긴다**.
         마지막 장에서만 단추가 나온다. 진도를 확정하는 자리라 실수로 밀려 넘어가면 안 된다. -->
    <!-- 화면 좌우에 붙박이 넘김 단추 (대표님 지시 2026-08-31).
         밀어서 넘기기도 그대로 둔다 — 단추는 밀기를 모르는 사람을 위한 것이다. -->
    <button id="goPrev" class="pagearrow left" type="button" aria-label="이전">‹</button>
    <button id="goNext" class="pagearrow right" type="button" aria-label="다음">›</button>
    <div class="pager">
      <span id="pos"></span>
      <button id="next" class="primary big" hidden>다음 ›</button>
    </div>
  </section>

  <!-- 퀴즈 -->
  <section id="quiz" class="view" hidden>
    <div id="quizBar" class="bar"><div id="quizFill"></div></div>
    <div id="quizBody"></div>
  </section>

  <!-- 성조 드릴 -->
  <section id="tone" class="view" hidden>
    <div id="toneBody"></div>
  </section>

  <!-- 규칙 -->
  <section id="rules" class="view" hidden>
    <div id="rulesBody"></div>
  </section>

  <!-- 업적 -->
  <section id="award" class="view" hidden>
    <div id="awardBody"></div>
  </section>

  <!-- 학습 과정 목록 -->
  <section id="course" class="view" hidden>
    <ol id="dayList" class="days"></ol>
  </section>

  <!-- 따라 말하기 -->
  <section id="speak" class="view" hidden>
    <div id="speakBody"></div>
  </section>

  <!-- 자판 -->
  <section id="type" class="view" hidden>
    <div id="typeBody"></div>
  </section>

  <!-- 손글씨 -->
  <section id="write" class="view" hidden>
    <div id="writeBody"></div>
  </section>

  <!-- 베트남 소식 -->
  <section id="news" class="view" hidden>
    <div id="newsBody"></div>
  </section>

  <!-- 사용법 -->
  <section id="guide" class="view" hidden>
    <div id="guideBody"></div>
  </section>

  <!-- 하위 메뉴 -->
  <section id="sub" class="view" hidden>
    <div id="subBody"></div>
  </section>

  <!-- 모의고사 -->
  <section id="exam" class="view" hidden>
    <div id="examBody"></div>
  </section>

  <!-- 주간 성적표 -->
  <section id="week" class="view" hidden>
    <div id="weekBody"></div>
  </section>

  <!-- 닉네임 -->
  <section id="nick" class="view" hidden>
    <div id="nickBody"></div>
  </section>

</main>

<!-- 하단 탭바 — 하루5분·학습·시험·내 정보 (2026-09-08, chaochao 최신 구조 이식) -->
<nav id="tabbar" aria-label="주요 이동">
  <button class="tabbtn" data-tab="daily" aria-label="하루5분">
    <svg viewBox="0 0 24 24"><path d="M13 2 4 14h6l-1 8 9-12h-6z"/></svg>
    <span>하루5분</span>
  </button>
  <button class="tabbtn" data-tab="study" aria-label="학습">
    <svg viewBox="0 0 24 24"><path d="M4 5.8c2.2-1 5-1 8 .3v13c-3-1.3-5.8-1.3-8-.3z"/><path d="M20 5.8c-2.2-1-5-1-8 .3v13c3-1.3 5.8-1.3 8-.3z"/></svg>
    <span>학습</span>
  </button>
  <button class="tabbtn" data-tab="exam" aria-label="시험">
    <svg viewBox="0 0 24 24"><rect x="4.5" y="3.5" width="15" height="17" rx="2"/><path d="M8 8.2h8M8 12h8M8 15.8h5"/></svg>
    <span>시험</span>
  </button>
  <button class="tabbtn" data-tab="me" aria-label="내 정보">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.6"/><path d="M4.8 20a7.2 7.2 0 0 1 14.4 0"/></svg>
    <span>내 정보</span>
  </button>
</nav>

<script src="pitch.js?v=aa760527"></script>
<script src="app.js?v=aa760527"></script>
</body>
</html>
